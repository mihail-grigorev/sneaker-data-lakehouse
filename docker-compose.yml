x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
    args:
      APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
      MAVEN_MIRROR: ${MAVEN_MIRROR:-https://repo1.maven.org/maven2}
  image: sneaker-airflow:2.9.1
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-sneakers-local-secret}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://s3:9000}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    PG_HOST: postgres
    PG_DB: datamart
    PG_USER: ${POSTGRES_USER:-airflow}
    PG_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
  depends_on:
    postgres:
      condition: service_healthy
    s3:
      condition: service_started

services:
  postgres:
    image: postgres:15-alpine
    container_name: de_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow} -d ${POSTGRES_DB:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage (RustFS; MinIO images were removed from public registries)
  s3:
    image: rustfs/rustfs:latest
    container_name: de_s3
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-minioadmin}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      RUSTFS_VOLUMES: /data
    ports:
      - "${S3_API_PORT:-9000}:9000"   # S3 API
      - "${S3_CONSOLE_PORT:-9001}:9001"   # Web console
    volumes:
      - s3data:/data

  # One-shot: create buckets, migrate Airflow DB, create admin user
  airflow-init:
    <<: *airflow-common
    container_name: de_airflow_init
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        python /opt/airflow/scripts/init_buckets.py
        airflow db migrate
        airflow users create --role Admin \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --email "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}" \
          --firstname "${AIRFLOW_ADMIN_FIRSTNAME:-Admin}" \
          --lastname "${AIRFLOW_ADMIN_LASTNAME:-User}" || true

  airflow-webserver:
    <<: *airflow-common
    container_name: de_airflow_webserver
    command: webserver
    ports:
      - "8082:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: de_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  s3data: